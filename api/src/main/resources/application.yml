spring:
  application:
    name: booking-platform-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:booking_platform}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Every datetime column holds UTC, whatever the server's own timezone is.
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Leave MAIL_HOST empty to have emails written to the log instead of sent.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

booking:
  jwt:
    secret: ${BOOKING_JWT_SECRET:change-this-development-only-secret-key-please}
    expiration-minutes: ${BOOKING_JWT_EXPIRATION_MINUTES:1440}

app:
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  # Where the links in emails point: the website, not this API.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:Bookly <no-reply@bookly.test>}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
